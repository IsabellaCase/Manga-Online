<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mangá Online</title>
</head>
<body>
    <header class="header">
        <div class="banner-container">
            <img
                class="banner-inicial"
                src="./assets/dragonballbanner (1).jpg"
                alt="Banner de Dragon Ball"
            >
        </div>
        <h1>Dragon Ball - Volume 1</h1>
    </header>

    <main class="reader-container">
        <div class="page-wrapper">
            <img src="./assets/dragon-ball-vol-1-s Capa (1).jpg" alt="Capa do mangá Dragon Ball">
        </div>

        <div class="controls">
            <button class="btn">Anterior</button>
            <span class="page-counter">Página 1 de 31</span>
            <button class="btn">Próximo</button>
        </div>
    </main>
</body>
</html>
